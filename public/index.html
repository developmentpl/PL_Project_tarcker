<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Project Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <h1>Dev Project Tracker</h1>
        <p class="subtitle">Application development project tracking</p>
      </div>
    </div>
    <div class="topbar-right">
      <nav class="tabs">
        <button class="tab active" data-view="dashboard">Dashboard</button>
        <button class="tab" data-view="completed">Completed</button>
        <button class="tab" data-view="analytics">Analytics</button>
        <button class="tab" data-view="admin">Admin</button>
        <button class="tab" data-view="logs">Logs</button>
      </nav>
      <button class="icon-btn" id="theme-toggle" title="Toggle light / dark">🌙</button>
      <button class="login-pill" id="login-pill">Admin login</button>
    </div>
  </header>

  <main id="app">
    <section id="view-dashboard" class="view"></section>
    <section id="view-completed" class="view hidden"></section>
    <section id="view-analytics" class="view hidden"></section>
    <section id="view-admin" class="view hidden"></section>
    <section id="view-logs" class="view hidden"></section>
  </main>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
